<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0066ff"/>
      <stop offset="1" stop-color="#00ffff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#222" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.5"/>
  <circle cx="930" cy="300" r="220" fill="none" stroke="#0066ff" stroke-width="1.5" opacity="0.25"/>
  <circle cx="930" cy="300" r="150" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.2"/>
  <g stroke="url(#ac)" stroke-width="10" fill="none">
    <rect x="820" y="210" width="220" height="160" rx="14"/>
    <path d="M820 270 h220 M880 210 v-50 M960 210 v-50"/>
  </g>
  <text x="90" y="360" font-family="'Space Grotesk',sans-serif" font-size="84" font-weight="800" fill="#ffffff">Linha Yamaha SMT</text>
  <text x="94" y="420" font-family="Manrope,sans-serif" font-size="34" fill="#00ffff">As máquinas funcionando na prática</text>
  <text x="90" y="120" font-family="'Space Grotesk',sans-serif" font-size="38" font-weight="700" fill="#0066ff">SM<tspan fill="#ffffff">TECH</tspan></text>
  <rect x="92" y="450" width="120" height="6" rx="3" fill="url(#ac)"/>
</svg>
